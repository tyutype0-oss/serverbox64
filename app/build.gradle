plugins { id 'com.android.application' }

def runtimeBaseUrl = (findProperty('runtimeBaseUrl') ?: '').toString()
def keystorePath = System.getenv('KEYSTORE_FILE')
def useReleaseKey = (keystorePath != null && !keystorePath.isEmpty())
def runNumber = Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')

android {
    namespace 'dev.servers.app'
    compileSdk 34

    defaultConfig {
        applicationId 'dev.servers.app'
        minSdk 26
        targetSdk 34
        versionCode runNumber
        versionName '2.0'
        ndk { abiFilters 'arm64-v8a' }
        buildConfigField 'String', 'RUNTIME_BASE_URL', '"' + runtimeBaseUrl + '"'
    }

    buildFeatures { buildConfig true }

    if (useReleaseKey) {
        signingConfigs {
            release {
                storeFile file(keystorePath)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.getByName(useReleaseKey ? 'release' : 'debug')
        }
    }

    sourceSets {
        main {
            java.srcDirs += ['../AndroidIntegration/src/main/java']
            jniLibs.srcDirs += ['../AndroidIntegration/src/main/jniLibs']
        }
    }

    packaging { jniLibs { useLegacyPackaging = true } }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError false }
}
